[project]
name = "tripweaver"
version = "0.1.0"
description = "Autonomous multi-agent travel planning system with a human approval gate"
requires-python = ">=3.11"

dependencies = [
    # Core
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "groq",
]


[project.optional-dependencies]

agents = [
    # [litellm] is required for LLM_PROVIDER=groq (app/config.py) --
    # CrewAI's LLM class only natively supports a fixed provider list
    # (openai, anthropic, google/gemini, ollama, ...) without it; Groq
    # specifically needs the full litellm fallback package.
    # "crewai[litellm]>=1.15.16",
    "crewai[litellm,google-genai]>=1.15.16"

]

worker = [
    # celery[redis] pulls in the `redis` Python client, which speaks the
    # standard Redis wire protocol -- Valkey is protocol-compatible, so
    # this same client talks to Valkey with no separate driver needed.
    "celery[redis]>=5.4",
]

mcp = [
    "fastmcp>=0.3",
]

api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Password hashing for the auth foundation (app/auth/passwords.py) --
    # used directly, not via passlib: passlib's bcrypt backend has had
    # repeated compatibility breaks with newer bcrypt releases, and this
    # project only needs hash/verify, not passlib's broader multi-algorithm
    # abstraction. Ships its own py.typed marker, so no separate stub
    # package is needed for mypy --strict.
    "bcrypt>=4.1",
    # JWT issuance/verification for the login endpoint (app/auth/tokens.py).
    # PyJWT directly, not python-jose: this project only needs HS256
    # encode/decode, not jose's broader JOSE/JWE/JWK surface -- same
    # narrow-dependency reasoning as choosing bcrypt over passlib above.
    "pyjwt>=2.9",
]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "celery-types>=0.22",
]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.uv]
package = false


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
